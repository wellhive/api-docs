                    description: 'Unauthorized: not authorized to make the request'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                            example:
                                name: Unauthorized
                "403":
                    description: 'Forbidden: the request is forbidden (example, the IP address is not within the Trusted Internet Connection [TIC] address range)'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                            example:
                                message: requests must originate from your organization's Trusted Internet Connection (TIC)
                                name: Forbidden
                "404":
                    description: 'Not Found: no resource with the specified ID is found'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                            example:
                                name: Not Found
                "429":
                    description: 'Too Many Requests: the number or rate of requests has exceeded a limit'
                    headers:
                        Retry-After:
                            description: indicates how long the user agent should wait before making a follow-up request
                            schema:
                                type: integer
                                description: indicates how long the user agent should wait before making a follow-up request
                                example: "60"
                                format: int64
                            example: "60"
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse27'
                            example:
                                isTemporary: true
                                name: Too Many Requests
                "500":
                    description: 'Internal Server Error: the server encountered an unexpected problem'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                            example:
                                isFault: true
                                isTemporary: true
                                name: Internal Server Error
            security:
                - jwt_header_Authorization: []
components:
    schemas:
        Action:
            type: object
            properties:
                assignedNetworkId:
                    type: string
                    description: the ID of the Network being referred
                    example: b6cc1875-5313-4ca8-af8b-74adac0c5d0c
                assignedProviderServiceId:
                    type: string
                    description: the ID of the Provider Service being referred
                    example: b6cc1875-5313-4ca8-af8b-74adac0c5d0c
                attentionItems:
                    type: array
                    items:
                        $ref: '#/components/schemas/AttentionItem'
                    description: any attention items relevant to the Action
                    example:
                        - category: medium
                          description: This is a full description of the attention item
                          summary: This is the summary of the attention item
                        - category: medium
                          description: This is a full description of the attention item
                          summary: This is the summary of the attention item
                        - category: medium
                          description: This is a full description of the attention item
                          summary: This is the summary of the attention item
                descriptionLines:
                    type: array
                    items:
                        type: string
                        example: Quae accusamus vero.
                    description: a full description of the action; each line is visually separated when displayed in the WellHive application
                    example:
                        - line 1
                        - line 2
                externalId:
                    type: string
                    description: the id of the Action, passed through from the source system
                    example: 69cd9203-5e92-47a3-aa03-94b03752872a
                isRecordReviewAcceptable:
                    type: boolean
                    description: whether the Action can be fulfilled by a record review instead of an in-person visit
                    example: true
                patientMustBePresent:
                    type: boolean
                    description: whether the patient must be present for the Action to be fulfilled
                    example: true
                patientPreferences:
                    $ref: '#/components/schemas/PatientPreferences'
                priorities:
                    type: array
                    items:
                        type: string
                        example: Quisquam occaecati doloremque id.
                    description: a list of priorities; WellHive does not operate on this attribute, but instead simply displays it to users and passes it through integrations
                    example:
                        - High
                priorityCode:
                    type: integer
                    description: the priority code of the Action, from 1 to 5 where 1 is the highest
                    example: 1
                    format: int64
                    minimum: 1
                    maximum: 5
                secondarySpecialtyIds:
                    type: array
                    items:
                        type: string
                        example: Accusamus pariatur vero ipsam aliquam quaerat sed.
                    description: the secondary specialty ids of the Action; each ID should be one returned by the /specialties endpoint
                    example:
                        - 69cd9203-5e92-47a3-aa03-94b03752872a
                        - 00eff3f3-ecfb-41ff-9ebc-78ed811e17f9
                specialtyIds:
                    type: array
                    items:
                        type: string
                        example: Nobis autem cum quo facere molestias.
                    description: the specialty ids of the Action; each ID should be one returned by the /specialties endpoint
                    example:
                        - 69cd9203-5e92-47a3-aa03-94b03752872a
                        - 00eff3f3-ecfb-41ff-9ebc-78ed811e17f9
                summary:
                    type: string
                    description: the summary of the Action
                    example: Initial evaluation for this episode of care
            example:
                assignedNetworkId: b6cc1875-5313-4ca8-af8b-74adac0c5d0c
                assignedProviderServiceId: b6cc1875-5313-4ca8-af8b-74adac0c5d0c
                attentionItems:
                    - category: medium
                      description: This is a full description of the attention item
                      summary: This is the summary of the attention item
                    - category: medium
                      description: This is a full description of the attention item
                      summary: This is the summary of the attention item
                    - category: medium
                      description: This is a full description of the attention item
                      summary: This is the summary of the attention item
                    - category: medium
                      description: This is a full description of the attention item
                      summary: This is the summary of the attention item
                descriptionLines:
                    - line 1
                    - line 2
                externalId: 69cd9203-5e92-47a3-aa03-94b03752872a
                isRecordReviewAcceptable: true
                patientMustBePresent: true
                patientPreferences:
                    providerSex: female
                priorities:
                    - High
                priorityCode: 1
                secondarySpecialtyIds:
                    - 69cd9203-5e92-47a3-aa03-94b03752872a
                    - 00eff3f3-ecfb-41ff-9ebc-78ed811e17f9
                specialtyIds:
                    - 69cd9203-5e92-47a3-aa03-94b03752872a
                    - 00eff3f3-ecfb-41ff-9ebc-78ed811e17f9
                summary: Initial evaluation for this episode of care
        Address:
            type: object
            properties:
                city:
                    type: string
                    example: Apopka
                country:
                    type: string
                    example: US
                line:
                    type: array
                    items:
                        type: string
                        example: Ex quisquam voluptas exercitationem in quia qui.
                    description: Street name, number, direction
                    example:
                        - 120 Main Street
                period:
                    $ref: '#/components/schemas/Period'
                postalCode:
                    type: string
                    example: "12345"
                state:
                    type: string
                    example: FL
                type:
                    type: string
                    example: postal
                    enum:
                        - postal
                        - physical
                        - both
                use:
                    type: string
                    example: home
                    enum:
                        - home
                        - work
                        - temp
                        - old
                        - billing
            example:
                city: Apopka
                country: US
                line:
                    - 120 Main Street
                period:
                    end: "2002-10-23T06:36:36Z"
                    start: "1970-12-12T07:59:31Z"
                postalCode: "12345"
                state: FL
                type: postal
                use: home
        Appointment:
            type: object
            properties:
                appointmentDetails:
                    $ref: '#/components/schemas/AppointmentDetails'
                error:
                    type: string
                    description: |4
                        indicates an error has occurred when processing a request to submit or cancel an Appointment. Possible values include, but are not limited to:
                        * already-canceled - the Appointment is already canceled
                        * appointment-request-id-required - an appointment request is required to book this appointment
                        * appointment-request-not-open - the appointment request is no longer open for booking
                        * bad-request - something in the submit or cancel request is invalid, such as a Slot ID or CancelReason ID
                        * booking-failed-status - the ProviderService reported a booking-failed status with no further detail
                        * cannot-book-for-established-patient - this is an established patient; the provider must be called to schedule
                        * create-timeout-in-flight - the booking request timed out and the appointment status cannot be confirmed and should not be reattempted; WellHive is aware and working to resolve
                        * cross-state-lines - the ProviderService requires provider and patient addresses to be in the same state
                        * forbidden - not permitted to book appointments to this ProviderService
                        * internal-error - an internal error has occurred; WellHive is aware and working to resolve
                        * invalid-email - the patient's email was rejected by the ProviderService
                        * patient-appointment-conflict - the Patient has an existing appointment at the requested time
                        * slot-conflict - the identified Slot is no longer available
                        * too-far-in-the-future - the identified Slot is too far in the future to book
                        * too-late-to-cancel - the Appointment time is too near to current time to allow cancelling
                        * unique-match-bad-request - an issue matching this specific patient to the selected ProviderService; WellHive is aware and working to resolve
                    example: slot-conflict
                id:
                    type: string
                    example: b79e46ba-1b09-4195-ae0a-ea42baedea6e
                    minLength: 1
                networkId:
                    type: string
                    description: a reference to the Network the Appointment is associated with, e.g. the authorizing Network; set by the API client when submitting the Appointment
                    example: 00eff3f3-ecfb-41ff-9ebc-78ed811e17f9
                patientId:
                    type: string
                    description: a reference to a Patient; set when creating the Appointment
                    example: b6cc1875-5313-4ca8-af8b-74adac0c5d0c
                    minLength: 1
                providerServiceId:
                    type: string
                    description: a reference to the ProviderService performing the Appointment, i.e. the ProviderService offering the Slot; set by the API client when submitting the Appointment
                    example: 69cd9203-5e92-47a3-aa03-94b03752872a
                referral:
                    $ref: '#/components/schemas/AppointmentReferral'
                slotIds:
                    type: array
                    items:
                        type: string
                        example: Blanditiis consequatur.
                    description: a reference to the Slot or sequenced Slots the Appointment is or will be booked to; set by the API client when submitting the Appointment
                    example:
                        - dba0855e-5681-411d-801c-036f4f046988
                state:
                    type: string
                    description: |4
                        the lifecycle state of the Appointment, set by WellHive
                        * draft - the Appointment starts in this state when it is first created, waiting to be submitted to a ProviderService
                        * submitted - indicates that the the Appointment was successfully submitted to a ProviderService to be booked, at which point the appointmentDetails.status field reports the Apppointment status from the ProviderService
                        * completed - indicates the Appointment is in a final state, whether fulfilled, cancelled, or noshow reported by the ProviderService, or cancelled by a WellHive user or API client
                    example: submitted
                    enum:
                        - draft
                        - submitted
                        - completed
                    minLength: 1
            example:
                appointmentDetails:
                    appointmentType:
                        id: k9512p-bas2-42k1-55pl-ie259x10k5b71
                        name: New Patient
                    cancelReason:
                        id: 930c8a9f-ce78-449c-8dda-d5428d183ec8
                        name: Patient
                    isLatest: true
                    lastRetrieved: "2001-08-19T20:36:51Z"
                    phone: 555-555-1000
                    start: "2026-01-01T17:00:00Z"
                    status: booked
                error: slot-conflict
                id: b79e46ba-1b09-4195-ae0a-ea42baedea6e
                networkId: 00eff3f3-ecfb-41ff-9ebc-78ed811e17f9
                patientId: b6cc1875-5313-4ca8-af8b-74adac0c5d0c
                providerServiceId: 69cd9203-5e92-47a3-aa03-94b03752872a
                referral:
                    referralNumber: "12345"
                slotIds:
                    - dba0855e-5681-411d-801c-036f4f046988
                state: submitted
            required:
                - id
                - state
                - patientId

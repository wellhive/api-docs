        AISchedulingRecoveryAttempt:
            type: object
            properties:
                detail:
                    type: string
                    example: Expanded search radius to 50 miles
                providerOrgCount:
                    type: integer
                    description: number of provider organizations matching after this strategy
                    example: 2023926502641193554
                    format: int64
                strategy:
                    type: string
                    description: the recovery strategy attempted. 'fallback-non-digital' is the last resort, offering provider services that do not support digital booking. WellHive owns this vocabulary and adds to it, so treat a strategy you do not recognize as one more attempt and read detail for what it did.
                    example: expand-distance
            example:
                detail: Expanded search radius to 50 miles
                providerOrgCount: 969797596897540999
                strategy: expand-distance
            required:
                - strategy
                - detail
        AISchedulingRecoveryReport:
            type: object
            properties:
                attempts:
                    type: array
                    items:
                        $ref: '#/components/schemas/AISchedulingRecoveryAttempt'
                    example:
                        - detail: Expanded search radius to 50 miles
                          providerOrgCount: 3743538639209257762
                          strategy: expand-distance
                        - detail: Expanded search radius to 50 miles
                          providerOrgCount: 3743538639209257762
                          strategy: expand-distance
                        - detail: Expanded search radius to 50 miles
                          providerOrgCount: 3743538639209257762
                          strategy: expand-distance
                        - detail: Expanded search radius to 50 miles
                          providerOrgCount: 3743538639209257762
                          strategy: expand-distance
                exhausted:
                    type: boolean
                    description: whether all recovery strategies were exhausted without producing results
                    example: false
            description: a report of the recovery strategies the pipeline used when the initial search returned no results
            example:
                attempts:
                    - detail: Expanded search radius to 50 miles
                      providerOrgCount: 3743538639209257762
                      strategy: expand-distance
                    - detail: Expanded search radius to 50 miles
                      providerOrgCount: 3743538639209257762
                      strategy: expand-distance
                exhausted: false
            required:
                - attempts
                - exhausted
        AISchedulingSendMessagePayload:
            type: object
            properties:
                authToken:
                    type: string
                    example: Et possimus labore amet quis sunt fugiat.
                content:
                    type: string
                    description: the user's message text; printable text, max 500 characters. A longer message is rejected rather than truncated, because the dropped tail could carry the actual constraint the patient cares about
                    example: afternoons only, within 10 miles
                    minLength: 1
                    maxLength: 500
                sessionId:
                    type: string
            description: send a user message within an AI scheduling session
            example:
                authToken: Sunt eos qui aliquid amet necessitatibus.
                content: afternoons only, within 10 miles
            required:
                - authToken
                - sessionId
                - content

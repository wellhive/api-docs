        HumanName:
            type: object
            properties:
                family:
                    type: string
                    description: Surname
                    example: Doe
                given:
                    type: array
                    items:
                        type: string
                        example: Impedit id officia.
                    description: Given names (not always 'first'). Includes middle names
                    example:
                        - Jane
                period:
                    $ref: '#/components/schemas/Period'
                prefix:
                    type: array
                    items:
                        type: string
                        example: Culpa ut repellat.
                    example:
                        - Ms
                suffix:
                    type: array
                    items:
                        type: string
                        example: Praesentium autem aliquam rem.
                    example:
                        - PhD
                text:
                    type: string
                    description: Text representation of the full name
                    example: Jane Doe
                use:
                    type: string
                    example: usual
                    enum:
                        - usual
                        - official
                        - temp
                        - nickname
                        - anonymous
                        - old
                        - maiden
            description: A name of a human with text, parts and usage information
            example:
                family: Doe
                given:
                    - Jane
                period:
                    end: "2002-10-23T06:36:36Z"
                    start: "1970-12-12T07:59:31Z"
                prefix:
                    - Ms
                suffix:
                    - PhD
                text: Jane Doe
                use: usual

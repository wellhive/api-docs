                  description: the ID of the Appointment to cancel
                  required: true
                  schema:
                    type: string
                    description: the ID of the Appointment to cancel
                    example: 69cd9203-5e92-47a3-aa03-94b03752872a
                    minLength: 1
                  example: 69cd9203-5e92-47a3-aa03-94b03752872a

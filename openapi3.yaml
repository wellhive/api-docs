                    type: array
                    items:
                        type: string
                        example: Officia quibusdam ipsam impedit.
                    description: find ProviderServices by ID
                    example:
                        - 69cd9203-5e92-47a3-aa03-94b03752872a
                        - 00eff3f3-ecfb-41ff-9ebc-78ed811e17f9
                includeInactive:
                    type: boolean
                    description: whether to include ProviderServices that are inactive; if not populated, inactive ProviderServices are excluded by default, while active ProviderServices are always included
                    example: false
                isSelfSchedulable:
                    type: boolean
                    description: filter to only ProviderServices that support patient self scheduling; if not populated, ProviderServices that do not support self scheduling are also included
                    example: true
                maxMilesFromNear:
                    type: integer
                    description: find ProviderServices within a max distance in miles from nearLocation; required if nearLocation is provided
                    example: 25
                    format: int32
                nearLocation:
                    type: string
                    description: find ProviderServices near the comma delimited latitude,longitude
                    example: 90.0,180.0
                networkId:
                    type: array
                    items:
                        type: string
                        example: Quidem sed quo esse sunt et praesentium.
                    description: find ProviderServices in the identified Networks
                    example:
                        - 69cd9203-5e92-47a3-aa03-94b03752872a
                nextToken:
                    type: string
                    description: the nextToken from a previous ProviderServiceSearchResult to use for retrieving the next page, other params are ignored when this one is provided
                    example: YTI0NTM5NzUtNzA2My00NTU5LWJiYWYtZTg3MGY4ZWZlYzg5
                npi:
                    type: string
                    description: the National Provider ID of practitioner or group
                    example: "1245319599"
                organizationName:
                    type: array
                    items:
                        type: string
                        example: Aut ut laudantium id sunt consectetur.
                    description: find ProviderServices with matching organization names

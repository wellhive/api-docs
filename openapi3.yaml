tags:
    - name: CarePlan
      description: one or more actions referenced by a Referral, to be performed by a ProviderService assigned the Referral
    - name: DriveTime
      description: the time it takes to drive the shortest route from origin to destination
    - name: Network
      description: a group of ProviderOrganizations and ProviderServices authorized to receive Appointments
    - name: ProviderOrganization
      description: a group of ProviderServices, member of one or more Networks
    - name: Appointment
      description: an appointment to receive care from a ProviderService
    - name: Referral
      description: an order to send a Patient to a ProviderService, ProviderOrganization, or Network; can be backed by a customer system integration
    - name: ProviderService
      description: a Service offered by Provider (individual or organization) at a Location for particular Specialties and VisitMode
    - name: Specialty
      description: a type of care offered by a ProviderService, one of a set of Specialties configured for the customer
    - name: SpecialtyGroup
      description: a group of Specialties, one of a set of SpecialtyGroups configured for the customer
security:
    - jwt_header_: []

                    minLength: 1
                    maxLength: 500
            example:
                content: afternoons only, within 10 miles
            required:
                - content
        AISchedulingSession:
            type: object
            properties:
                accessCriteria:
                    $ref: '#/components/schemas/AISchedulingAccessCriteriaResult'
                appointmentId:
                    type: string
                    description: 'the care-navigation Appointment that wh-api creates server-side when a session starts with a referral context. It takes the place of the draft Appointment you would start with in the manual flow, so do not create one separately for this flow. Pass it to Appointment.submit to book the chosen slot. It is not set for sessions with contextType none (walk-up). Creation is best-effort: if it is absent on a referral-context session, create an Appointment with Appointment.create and use that ID instead.'
                    example: b79e46ba-1b09-4195-ae0a-ea42baedea6e
                contextType:
                    type: string
                    description: the scheduling context for the session
                    example: referral
                    enum:
                        - none
                        - referral
                continuitySignal:
                    $ref: '#/components/schemas/AISchedulingContinuitySignal'
                createdAt:
                    type: string
                    example: "2026-05-23T15:30:00Z"
                    format: date-time
                error:
                    type: string
                    description: 'set only when phase is ''error''; a display-ready message you can show the end user. The value comes from a closed set: ''Scheduling timed out before results were ready. Please try again.'', ''The scheduling assistant is temporarily unavailable. Please try again shortly.'', ''Provider availability could not be retrieved. Please try again shortly.'', or ''Scheduling could not be completed. Please try again, or contact your care team to schedule directly.'' The set may gain members, so treat an unrecognized value as the generic case rather than failing. This is never a diagnostic — it carries no internal detail, so use phase for control flow and this for display.'
                    example: Scheduling could not be completed. Please try again, or contact your care team to schedule directly.
                id:
                    type: string
                    description: the AI scheduling session ID
                    example: 8a5fe127-82f1-48aa-8b70-0249cf9880fc
                parsedPreferences:
                    $ref: '#/components/schemas/AISchedulingParsedPreferences'
                patientId:
                    type: string
                    example: b6cc1875-5313-4ca8-af8b-74adac0c5d0c
                phase:
                    type: string
                    description: 'the step the session has reached, and the signal for whether to keep polling. The value comes from a closed set, but the set may gain members, so treat an unrecognized value as work in progress rather than failing. Keep polling AIScheduling.show while phase names work in progress: ''understanding'', ''searching'', ''recovering'', ''recommending-providers'', ''recommending-slots'', and any value you do not recognize. Every other phase means nothing further happens until you send a message with AIScheduling.sendMessage: ''ready-to-book'' and ''no-availability'' carry the outcome of the last run, ''error'' reports a failure, and ''idle'' and ''awaiting-clarification'' are waiting on the patient''s next message. An API client surfacing a chat UI can also use this for per-step indicators.'
                    example: ready-to-book
                progress:
                    $ref: '#/components/schemas/AISchedulingProgress'
                recommendations:
                    $ref: '#/components/schemas/AISchedulingRecommendations'
                recoveryReport:
                    $ref: '#/components/schemas/AISchedulingRecoveryReport'
                referralId:
                    type: string
                    example: 69cd9203-5e92-47a3-aa03-94b03752872a
                status:
                    type: string
                    description: session lifecycle status
                    example: active
                    enum:
                        - active
                        - complete

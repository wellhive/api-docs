                    example: "2026-01-01T17:00:00Z"
                    format: date-time
                status:
                    type: string
                    example: booked
                    enum:
                        - proposed
                        - booked
                        - fulfilled
                        - cancelled
                        - noshow
                        - entered-in-error
                        - checked-in
                        - pending-booking
                        - pending-cancel
                        - booking-failed
                        - cancel-failed
                        - unknown

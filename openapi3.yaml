        Appointment:
            type: object
            properties:
                appointmentDetails:
                    $ref: '#/components/schemas/AppointmentDetails'
                error:
                    type: string
                    description: |4
                        indicates an error has occurred when processing a request to submit or cancel an Appointment. Possible values include, but are not limited to:
                        * already-canceled - the Appointment is already canceled
                        * appointment-request-id-required - an appointment request is required to book this appointment
                        * appointment-request-not-open - the appointment request is no longer open for booking
                        * bad-request - something in the submit or cancel request is invalid, such as a Slot ID or CancelReason ID
                        * booking-failed-status - the ProviderService reported a booking-failed status with no further detail
                        * cannot-book-for-established-patient - this is an established patient; the provider must be called to schedule
                        * create-timeout-in-flight - the booking request timed out and the appointment status cannot be confirmed and should not be reattempted; WellHive is aware and working to resolve
                        * cross-state-lines - the ProviderService requires provider and patient addresses to be in the same state
                        * forbidden - not permitted to book appointments to this ProviderService
                        * internal-error - an internal error has occurred; WellHive is aware and working to resolve
                        * invalid-email - the patient's email was rejected by the ProviderService
                        * patient-appointment-conflict - the Patient has an existing appointment at the requested time
                        * slot-conflict - the identified Slot is no longer available
                        * too-far-in-the-future - the identified Slot is too far in the future to book
                        * too-late-to-cancel - the Appointment time is too near to current time to allow cancelling
                        * unique-match-bad-request - an issue matching this specific patient to the selected ProviderService; WellHive is aware and working to resolve
                    example: slot-conflict
                id:
                    type: string
                    example: b79e46ba-1b09-4195-ae0a-ea42baedea6e
                    minLength: 1
                networkId:
                    type: string
                    description: a reference to the Network the Appointment is associated with, e.g. the authorizing Network; set by the API client when submitting the Appointment
                    example: 00eff3f3-ecfb-41ff-9ebc-78ed811e17f9
                patientId:
                    type: string
                    description: a reference to a Patient; set when creating the Appointment
                    example: b6cc1875-5313-4ca8-af8b-74adac0c5d0c
                    minLength: 1
                providerServiceId:
                    type: string
                    description: a reference to the ProviderService performing the Appointment, i.e. the ProviderService offering the Slot; set by the API client when submitting the Appointment
                    example: 69cd9203-5e92-47a3-aa03-94b03752872a
                referral:
                    $ref: '#/components/schemas/AppointmentReferral'
                slotIds:
                    type: array
                    items:
                        type: string
                        example: Nobis voluptate nobis impedit reprehenderit sed.
                    description: a reference to the Slot or sequenced Slots the Appointment is or will be booked to; set by the API client when submitting the Appointment. Each value is opaque — pass through verbatim the ID returned by ProviderService.searchSlots or an AI scheduling slot recommendation.
                    example:
                        - 8f2b1c4e-3d5a-4b6c-9e7f-1a2b3c4d5e6f|1|2026-06-12T13:00:00Z|30m0s|c9d8e7f6-a5b4-4c3d-8e2f-1a0b9c8d7e6f
                state:
                    type: string
                    description: |4
                        the lifecycle state of the Appointment, set by WellHive
                        * draft - the Appointment starts in this state when it is first created, waiting to be submitted to a ProviderService
                        * submitted - indicates that the the Appointment was successfully submitted to a ProviderService to be booked, at which point the appointmentDetails.status field reports the Apppointment status from the ProviderService
                        * completed - indicates the Appointment is in a final state, whether fulfilled, cancelled, or noshow reported by the ProviderService, or cancelled by a WellHive user or API client
                    example: submitted
                    enum:
                        - draft
                        - submitted
                        - completed
                    minLength: 1
            example:
                appointmentDetails:
                    appointmentType:
                        id: k9512p-bas2-42k1-55pl-ie259x10k5b71
                        name: New Patient
                    cancelReason:
                        id: 930c8a9f-ce78-449c-8dda-d5428d183ec8
                        name: Patient
                    isLatest: true
                    lastRetrieved: "2001-08-19T20:36:51Z"
                    phone: 555-555-1000
                    start: "2026-01-01T17:00:00Z"
                    status: booked
                error: slot-conflict
                id: b79e46ba-1b09-4195-ae0a-ea42baedea6e
                networkId: 00eff3f3-ecfb-41ff-9ebc-78ed811e17f9
                patientId: b6cc1875-5313-4ca8-af8b-74adac0c5d0c
                providerServiceId: 69cd9203-5e92-47a3-aa03-94b03752872a
                referral:
                    referralNumber: "12345"
                slotIds:
                    - 8f2b1c4e-3d5a-4b6c-9e7f-1a2b3c4d5e6f|1|2026-06-12T13:00:00Z|30m0s|c9d8e7f6-a5b4-4c3d-8e2f-1a0b9c8d7e6f
                state: submitted
            required:
                - id
                - state
                - patientId

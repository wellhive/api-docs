        AISchedulingSlotRecommendation:
            type: object
            properties:
                appointmentType:
                    type: string
                    example: Magni itaque ut consequatur.
                category:
                    $ref: '#/components/schemas/AISchedulingCategory'
                dateTime:
                    type: string
                    description: slot start time
                    example: "2026-06-12T13:00:00Z"
                    format: date-time
                distanceDisplay:
                    type: string
                    example: Ab quia repellendus accusamus aut quia.
                location:
                    type: string
                    example: Ea eveniet neque tempore ex quia porro.
                providerName:
                    type: string
                    example: Qui sapiente ea et.
                providerServiceId:
                    type: string
                    description: the care-navigation ProviderService ID
                    example: b6cc1875-5313-4ca8-af8b-74adac0c5d0c
                rank:
                    type: integer
                    description: position in the slots list, starting at 1 with no gaps; 1 is the best match, and a higher number is a worse one. Numbered independently of the provider-service lists.
                    example: 1
                    format: int64
                restrictionReason:
                    type: string
                    description: why this slot is contended, when it is. Absent on an ordinary slot, which is the common case. A slot that carries this is still bookable — book it the same way — but another booker may be holding the same time, so Appointment.submit is more likely to fail and the caller should be ready to offer the next slot. 'schedule-overlap' means the scheduling system reports a known conflict; 'schedule-overlap-unknown' means it reports a conflict it cannot characterize. Treat the two the same unless you surface the distinction to a user. Slots this caller is not permitted to book are not returned at all, so that case never appears here.
                    example: schedule-overlap
                    enum:
                        - schedule-overlap
                        - schedule-overlap-unknown
                slotId:
                    type: string
                    description: the care-navigation Slot ID; pass this in Appointment.submit. Treat it as an opaque string and pass it through verbatim — it is not a UUID, and its internal structure varies by the provider's scheduling system.
                    example: 8f2b1c4e-3d5a-4b6c-9e7f-1a2b3c4d5e6f|1|2026-06-12T13:00:00Z|30m0s|c9d8e7f6-a5b4-4c3d-8e2f-1a0b9c8d7e6f
                targetDateOffset:
                    type: integer
                    description: 'the slot''s signed day distance from the date window the pipeline searched: 0 when the slot falls inside the window, negative when it falls that many days before the window''s near edge, positive when it falls that many days past the far edge. The window comes from the patient''s temporal request as the pipeline classified it. A request that names no date, such as ''as soon as possible'' or an open-ended ''not for a couple of weeks'', has no window to measure against, so this is absent for those sessions.'
                    example: -3
                    format: int64
            description: a ranked slot recommendation
            example:
                appointmentType: Itaque rerum tempora consectetur id exercitationem.
                category:
                    label: Preferred
                    value: preferred
                dateTime: "2026-06-12T13:00:00Z"
                distanceDisplay: Unde ut autem consequuntur perspiciatis.
                location: Voluptas qui.
                providerName: Aperiam aspernatur aspernatur repudiandae.
                providerServiceId: b6cc1875-5313-4ca8-af8b-74adac0c5d0c
                rank: 1
                restrictionReason: schedule-overlap
                slotId: 8f2b1c4e-3d5a-4b6c-9e7f-1a2b3c4d5e6f|1|2026-06-12T13:00:00Z|30m0s|c9d8e7f6-a5b4-4c3d-8e2f-1a0b9c8d7e6f
                targetDateOffset: -3
            required:
                - providerServiceId
                - slotId
                - dateTime
                - rank
        AISchedulingTargetDate:
            type: object
            properties:
                date:
                    type: string
                    description: target date in YYYY-MM-DD format
                    example: "2026-06-15"
                    format: date
                source:
                    type: string
                    description: where the date came from. 'user-specified' means the conversation produced it. Provenance for display, not control flow.
                    example: user-specified
                    enum:
                        - user-specified
            description: 'the session''s date constraint, as a single representative date. Derived from the patient''s temporal request and lossy by construction: a month, a date range and an open-ended request all collapse to one day, and a request with no meaningful single date sets nothing at all. Read the conversation turns for what the patient actually asked.'
            example:
                date: "2026-06-15"
                source: user-specified
            required:
                - date

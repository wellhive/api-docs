                    example: true
                lastRetrieved:
                    type: string
                    description: date and time when the details were last retrieved from the ProviderService
                    example: "2001-08-19T20:36:51Z"
                    format: date-time
                phone:
                    type: string
                    description: a phone number specifically for calling about this Appointment
                    example: 555-555-1000
                start:

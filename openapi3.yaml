components:
    schemas:
        AISchedulingAccessCriteriaResult:
            type: object
            properties:
                accessCriteriaId:
                    type: string
                    description: the identifier of the access-criteria tier in the customer's access-criteria configuration. This is an opaque string owned by that configuration, so do not assume a fixed set of values.
                    example: group-1
                accessCriteriaName:
                    type: string
                    description: the customer-facing display name of the access-criteria tier
                    example: Primary / Mental Health
                driveMinutes:
                    type: integer
                    description: maximum drive time threshold in minutes
                    example: 30
                    format: int64
                waitDays:
                    type: integer
                    description: maximum wait time threshold in days
                    example: 20
                    format: int64
            description: 'wh-api''s AccessCriteria: the customer-configured access-standard tier (drive-time and wait-time thresholds) resolved for the specialty the session is scheduling'
            example:
                accessCriteriaId: group-1
                accessCriteriaName: Primary / Mental Health
                driveMinutes: 30
                waitDays: 20
        AISchedulingAppointmentType:
            type: object
            properties:
                id:
                    type: string
                    example: Est at autem.
                name:
                    type: string
                    example: Quis et hic debitis ea.
            example:
                id: Sint culpa.
                name: Et quae inventore nihil quibusdam cupiditate est.
            required:
                - id
                - name
        AISchedulingCategory:
            type: object
            properties:
                label:
                    type: string
                    description: customer-configured display label for this category; defaults to a humanized form of value until a label is configured
                    example: Preferred
                value:
                    type: string
                    description: canonical category value; the same for every customer
                    example: preferred
                    enum:
                        - preferred
                        - other
            description: 'a recommendation''s network category: a canonical value to branch logic on, plus a customer-configured display label to render'
            example:
                label: Preferred
                value: preferred
            required:
                - value
        AISchedulingContinuitySignal:
            type: object
            properties:
                lastSeenDate:
                    type: string
                    description: ISO date of last completed appointment
                    example: "2024-08-15"
                    format: date
                providerName:
                    type: string
                    description: the display name of the provider from the patient's last completed appointment
                    example: Nobis ut qui consequatur est itaque vel.
                providerServiceId:
                    type: string
                    description: the care-navigation ProviderService ID of the returning provider, when available
                    example: Sapiente odio ut enim consequatur aliquam officiis.
                specialtyName:
                    type: string
                    description: 'the specialty display name from that appointment: free text for display, not a Specialty code'
                    example: Dicta sequi velit ut fugiat quia ad.
            description: 'continuity-of-care signal: the patient''s most recent completed appointment in the matching specialty'
            example:
                lastSeenDate: "2024-08-15"
                providerName: A et.
                providerServiceId: Sit sapiente id est aut voluptatibus.
                specialtyName: Vitae magnam consequatur quo eligendi.
        AISchedulingCreateSessionPayload:
            type: object
            properties:
                authToken:
                    type: string
                    example: Quod architecto ipsam facere et beatae quia.
                contextType:
                    type: string
                    description: the type of scheduling context
                    example: referral
                    enum:
                        - none
                        - referral
                patientId:
                    type: string
                    description: patient to schedule for
                    example: b6cc1875-5313-4ca8-af8b-74adac0c5d0c
                referralId:
                    type: string
                    description: 'required when contextType is referral: the id of a care-navigation Referral, as returned by Referral.search or Referral.show'
                    example: 69cd9203-5e92-47a3-aa03-94b03752872a
            description: create a new AI scheduling session for a patient
            example:
                authToken: Et ut possimus quam.
                contextType: referral
                patientId: b6cc1875-5313-4ca8-af8b-74adac0c5d0c
                referralId: 69cd9203-5e92-47a3-aa03-94b03752872a
            required:
                - authToken
                - contextType
                - patientId
        AISchedulingCreateSessionPayload2:
            type: object
            properties:
                contextType:
                    type: string
                    description: the type of scheduling context
                    example: referral
                    enum:
                        - none
                        - referral
                patientId:
                    type: string
                    description: patient to schedule for
                    example: b6cc1875-5313-4ca8-af8b-74adac0c5d0c
                referralId:
                    type: string
                    description: 'required when contextType is referral: the id of a care-navigation Referral, as returned by Referral.search or Referral.show'
                    example: 69cd9203-5e92-47a3-aa03-94b03752872a
            example:
                contextType: referral
                patientId: b6cc1875-5313-4ca8-af8b-74adac0c5d0c
                referralId: 69cd9203-5e92-47a3-aa03-94b03752872a
            required:
                - contextType
                - patientId
        AISchedulingParsedPreferences:
            type: object
            properties:
                appointmentType:
                    type: string
                    example: new-patient
                daysOfWeek:
                    type: array
                    items:
                        type: string
                        example: Numquam enim esse id ea.
                    description: 'days the patient asked for, as three-letter lowercase codes: mon, tue, wed, thu, fri, sat, sun. These are the same codes as the daysOfWeek values on Referral patientPreferences.schedulingPreferences.'
                    example:
                        - mon
                        - tue
                        - wed
                maxDistanceMiles:
                    type: number
                    example: 10
                    format: double
                providerGender:
                    type: string
                    example: female
                    enum:
                        - male
                        - female
                rawFactors:
                    type: array
                    items:
                        type: string
                        example: Sint non est assumenda aut consequuntur asperiores.
                    description: free-form factors the pipeline extracted that don't map to a structured field
                    example:
                        - prefers a female provider
                        - needs wheelchair accessible parking
                specialty:
                    type: string
                    description: 'the specialty as the pipeline read it from the conversation: free text, not a Specialty code. The pipeline resolves it to the customer''s configured Specialties internally before it searches, and that resolution is not published here. Use this for display, and use Specialty.search to look a specialty up.'
                    example: Family Medicine
                targetDate:
                    $ref: '#/components/schemas/AISchedulingTargetDate'
                timeOfDay:
                    type: array
                    items:
                        type: string
                        example: Nisi porro ut eius sunt exercitationem.
                    description: 'times of day the patient asked for: early-morning, morning, afternoon, evening. This is the pipeline''s own vocabulary, and it differs from the times values on Referral patientPreferences.schedulingPreferences (before-9am, between-9am-and-12pm, between-12pm-and-5pm, after-5pm).'
                    example:
                        - morning
                        - afternoon
                visitMode:
                    type: string
                    example: in-person
                    enum:
                        - in-person
                        - telehealth
                        - home-visit
            description: preferences the pipeline has extracted from the conversation
            example:
                appointmentType: new-patient
                daysOfWeek:
                    - mon
                    - tue
                    - wed
                maxDistanceMiles: 10
                providerGender: female
                rawFactors:
                    - prefers a female provider
                    - needs wheelchair accessible parking
                specialty: Family Medicine
                targetDate:
                    date: "2026-06-15"
                    source: user-specified
                timeOfDay:
                    - morning
                    - afternoon
                visitMode: in-person
        AISchedulingProgress:
            type: object
            properties:
                providerServiceCount:
                    type: integer
                    description: provider services returned by the current pipeline run
                    example: 12
                    format: int64
                recoveryRound:
                    type: integer
                    description: 1-indexed recovery iteration counter; persists into ready-to-book if recovery occurred
                    example: 1
                    format: int64
                slotCount:
                    type: integer
                    description: 'the size of the candidate slot pool the pipeline is working from, after the `daysOfWeek` and `timeOfDay` preferences the conversation has accumulated are applied. This is a progress signal, not a length: `recommendations.slots` is a truncated display set drawn from that pool, and pool slots that cannot be booked are never published. Expect this number to exceed the size of that array, and read the array itself for what you received.'
                    example: 8
                    format: int64
            description: granular pipeline progress counters; all fields are optional and only set once the corresponding pipeline step has produced a meaningful number
            example:
                providerServiceCount: 12
                recoveryRound: 1
                slotCount: 8
        AISchedulingProviderServiceRecommendation:
            type: object
            properties:
                appointmentTypes:
                    type: array
                    items:
                        $ref: '#/components/schemas/AISchedulingAppointmentType'
                    example:
                        - id: Sunt necessitatibus provident corporis voluptas perspiciatis qui.
                          name: Molestiae magnam ex amet id esse.
                        - id: Sunt necessitatibus provident corporis voluptas perspiciatis qui.
                          name: Molestiae magnam ex amet id esse.
                category:
                    $ref: '#/components/schemas/AISchedulingCategory'
                continuityMatch:
                    type: boolean
                    description: whether this is a returning provider for the patient
                    example: false
                distanceDisplay:
                    type: string
                    example: 4.2 mi
                distanceMeters:
                    type: number
                    example: 6759
                    format: double
                driveMinutes:
                    type: number
                    description: drive time to the provider's location in minutes
                    example: 12.4
                    format: double
                gender:
                    type: string
                    example: female
                location:
                    type: string
                    example: 123 Main St, Anytown, FL
                networkId:
                    type: string
                    description: a network the provider participates in; indicative only, and not necessarily the network this recommendation was categorized under — branch on category.value instead
                    example: b6cc1875-5313-4ca8-af8b-74adac0c5d0c
                organizationName:
                    type: string
                    example: Eclipse Health Group
                providerName:
                    type: string
                    description: the display name of the provider service, the same name ProviderService publishes. For a service with a single practitioner it is usually 'Practitioner - Facility'. For a clinic or imaging service with no practitioner, or with several, it is the clinic or organization name. It is always set, so do not read it as proof that a practitioner exists.
                    example: Dr. Smith - Anytown Family Practice
                providerServiceId:
                    type: string
                    description: the care-navigation ProviderService ID
                    example: b6cc1875-5313-4ca8-af8b-74adac0c5d0c
                rank:
                    type: integer
                    description: position in this list, starting at 1 with no gaps; 1 is the best match, and a higher number is a worse one. Ranks are renumbered on every pipeline run, so compare them only within one response.
                    example: 1
                    format: int64
                reasoning:
                    type: string
                    description: short AI-generated explanation of why this provider service was ranked here
                    example: Inventore qui reprehenderit ut in nemo similique.
                schedulingNotes:
                    type: string
                    description: provider-authored scheduling instructions for this service and visit mode; the same notes ProviderService publishes. Show them to whoever books the appointment — they have to be read before the booking is made.

openapi: 3.0.3
info:
    title: The WellHive Care Navigation API
    description: |-
        The API for navigating your patients' care across your internal and external networks of provider organizations and services.
        	
        Find more details [here](https://github.com/wellhive/api-docs).

        Copyright 2024 WellHive Holdings, LLC
    license:
        name: MIT
        url: https://github.com/wellhive/api-docs/blob/main/LICENSE
    version: 1.0 beta
servers:
    - url: https://api.wellhive.com
paths:
    /care-navigation/v1/appointments:
        get:
            tags:
                - Appointment
            summary: Appointment.search
            description: search for Appointments; one of id, patientId, referralNumber, or nextToken are required; includes the status and details currently known by WellHive, and does not attempt to retrieve the latest from the ProviderService's system (see the 'retrieveLatestDetails' param of Appointment.show)
            operationId: Appointment#search
            parameters:
                - name: id
                  in: query
                  description: find Appointments by ID
                  allowEmptyValue: true
                  schema:
                    type: array
                    items:
                        type: string
                        example: Rerum ullam nihil dolorum illo qui.
                    description: find Appointments by ID
                    example:
                        - 69cd9203-5e92-47a3-aa03-94b03752872a
                        - 00eff3f3-ecfb-41ff-9ebc-78ed811e17f9
                  example:
                    - 69cd9203-5e92-47a3-aa03-94b03752872a
                    - 00eff3f3-ecfb-41ff-9ebc-78ed811e17f9
                - name: patientId
                  in: query
                  description: find Appointments by Patient
                  allowEmptyValue: true
                  schema:
                    type: string
                    description: find Appointments by Patient
                    example: b6cc1875-5313-4ca8-af8b-74adac0c5d0c
                  example: b6cc1875-5313-4ca8-af8b-74adac0c5d0c
                - name: referralNumber
                  in: query
                  description: find Appointments by referralNumber
                  allowEmptyValue: true
                  schema:
                    type: string
                    description: find Appointments by referralNumber
                    example: "12345"
                  example: "12345"
                - name: onOrAfter
                  in: query
                  description: find Appointments that start(ed) on or after this date/time
                  allowEmptyValue: true
                  schema:
                    type: string
                    description: find Appointments that start(ed) on or after this date/time
                    example: "2026-01-01T00:00:00Z"
                    format: date-time
                  example: "2026-01-01T00:00:00Z"
                - name: state
                  in: query
                  description: find Appointments by lifecycle state
                  allowEmptyValue: true
                  schema:
                    type: string
                    description: find Appointments by lifecycle state
                    example: submitted
                  example: submitted
                - name: nextToken
                  in: query
                  description: the nextToken from a previous AppointmentSearchResult to use for retrieving the next page, other params are ignored when this one is provided
                  allowEmptyValue: true
                  schema:
                    type: string
                    description: the nextToken from a previous AppointmentSearchResult to use for retrieving the next page, other params are ignored when this one is provided
                    example: YTI0NTM5NzUtNzA2My00NTU5LWJiYWYtZTg3MGY4ZWZlYzg5
                  example: YTI0NTM5NzUtNzA2My00NTU5LWJiYWYtZTg3MGY4ZWZlYzg5
            responses:
                "200":
                    description: OK response.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AppointmentSearchResult'
                            example:
                                appointments:
                                    - appointmentDetails:
                                        appointmentType:
                                            id: k9512p-bas2-42k1-55pl-ie259x10k5b71
                                            name: New Patient
                                        cancelReason:
                                            id: 3b13a8cb-d4f3-4678-8bed-7fa3931c0c40
                                            name: Patient
                                        isLastest: true
                                        lastRetrieved: "2009-01-05T02:59:23Z"
                                        phone: 555-555-1000
                                        start: "2026-01-01T17:00:00Z"
                                        status: booked
                                      error: slot-conflict
                                      id: b79e46ba-1b09-4195-ae0a-ea42baedea6e
                                      networkId: 00eff3f3-ecfb-41ff-9ebc-78ed811e17f9
                                      patientId: b6cc1875-5313-4ca8-af8b-74adac0c5d0c
                                      providerServiceId: 69cd9203-5e92-47a3-aa03-94b03752872a
                                      referral:
                                        referralNumber: "12345"
                                      slotIds:
                                        - dba0855e-5681-411d-801c-036f4f046988
                                      state: submitted
                                    - id: bfd486ae-b04e-42a7-b049-8c689b6caef2
                                      patientId: b6cc1875-5313-4ca8-af8b-74adac0c5d0c
                                      referral:
                                        referralNumber: "6789"
                                      state: draft
                                count: 2
                                nextToken: YTI0NTM5NzUtNzA2My00NTU5LWJiYWYtZTg3MGY4ZWZlYzg5
                                total: 5
                "400":
                    description: 'Bad Request: something is wrong with the request'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                            example:
                                message: invalid value for field xyz
                                name: Bad Request
                "401":
                    description: 'Unauthorized: not authorized to make the request'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                            example:
                                name: Unauthorized
                "403":
                    description: 'Forbidden: the request is forbidden (example, the IP address is not within the Trusted Internet Connection [TIC] address range)'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                            example:
                                message: requests must originate from your organization's Trusted Internet Connection (TIC)
                                name: Forbidden
                "404":
                    description: 'Not Found: no resource with the specified ID is found'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                            example:
                                name: Not Found
                "429":
                    description: 'Too Many Requests: the number or rate of requests has exceeded a limit'
                    headers:
                        Retry-After:
                            description: indicates how long the user agent should wait before making a follow-up request
                            schema:
                                type: integer
                                description: indicates how long the user agent should wait before making a follow-up request
                                example: "60"
                                format: int64
                            example: "60"
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse9'
                            example:
                                isTemporary: true
                                name: Too Many Requests
                "500":
                    description: 'Internal Server Error: the server encountered an unexpected problem'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                            example:
                                isFault: true
                                isTemporary: true
                                name: Internal Server Error
                "504":
                    description: 'Gateway Timeout: timed out waiting for an external server, such as a customer''s Patient Index system'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                            example:
                                isTemporary: true
                                isTimeout: true
                                name: Gateway Timeout
            security:
                - jwt_header_Authorization: []
        post:
            tags:
                - Appointment
            summary: Appointment.create
            description: create an Appointment; this creates a draft Appointment that won't be booked until it is submitted
            operationId: Appointment#create
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/AppointmentCreatePayload2'
                        example:
                            patientId: b6cc1875-5313-4ca8-af8b-74adac0c5d0c
                            referral:
                                referralNumber: "12345"
            responses:
                "200":
                    description: OK response.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AppointmentResult'
                            examples:
                                default:
                                    summary: default
                                    value:
                                        id: b79e46ba-1b09-4195-ae0a-ea42baedea6e
                                        patientId: b6cc1875-5313-4ca8-af8b-74adac0c5d0c
                                        referral:
                                            referralNumber: "12345"
                                        state: draft
                "400":
                    description: 'Bad Request: something is wrong with the request'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/ErrorResponse'
                            example:
                                message: invalid value for field xyz

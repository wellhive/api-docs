        DriveTimePayload:
            type: object
            properties:
                appointmentId:
                    type: string
                    description: the ID of an Appointment, used for associating search metrics with the Appointment
                    example: e2487f73-62e7-476b-a8b7-503333572d2a
                arriveAt:
                    type: string
                    description: the date and time of arrival at each of the destinations; optional; it is an error to specify both departAt and arriveAt; if neither are specified then `now` will be used
                    example: "1992-08-28T00:59:36Z"
                    format: date-time
                departAt:
                    type: string
                    description: the date and time of departure from the origin; optional; it is an error to specify both departAt and arriveAt; if neither are specified then `now` will be used
                    example: "1992-08-28T00:59:36Z"
                    format: date-time
                destinations:
                    type: object
                    description: the set of destinations, e.g. ProviderServices' locations; identified by unique keys matching locations in the response; these keys can be, for example, the ProviderServices' IDs; limited to 100 destinations per request
                    example:
                        15417a36-c6d8-4f8c-b24e-324962bca8b6:
                            latitude: 56.29852310748572
                            longitude: -129.58656878932194
                    minLength: 1
                    maxLength: 100
                    additionalProperties:
                        $ref: '#/components/schemas/GeoLocation'
                origin:
                    $ref: '#/components/schemas/GeoLocation'
            example:
                destinations:
                    00eff3f3-ecfb-41ff-9ebc-78ed811e17f9:
                        latitude: -74.12870564772521
                        longitude: -151.6240405624497
                    69cd9203-5e92-47a3-aa03-94b03752872a:
                        latitude: -1.7437745123171688
                        longitude: -54.19187859370315
                origin:
                    latitude: 4.627174468915552
                    longitude: -88.72187894562788
            required:
                - origin
                - destinations
        DriveTimeResult:
            type: object
            properties:
                appointmentId:
                    type: string
                    description: the appointmentId specified in the request
                    example: e2487f73-62e7-476b-a8b7-503333572d2a
                arriveAt:
                    type: string
                    description: the arriveAt specified in the request
                    example: "1970-03-14T09:19:26Z"
                    format: date-time
                departAt:
                    type: string
                    description: the departAt specified in the request
                    example: "1970-03-14T09:19:26Z"
                    format: date-time
                destinations:
                    type: object
                    description: the destination that was included with the request, each with calculated distance and drive time
                    example:
                        00eff3f3-ecfb-41ff-9ebc-78ed811e17f9:
                            distanceInMiles: 4
                            driveTimeInSecondsWithTraffic: 566
                            driveTimeInSecondsWithoutTraffic: 493
                            latitude: -74.12870564772521
                            longitude: -151.6240405624497
                        69cd9203-5e92-47a3-aa03-94b03752872a:
                            distanceInMiles: 9
                            driveTimeInSecondsWithTraffic: 1314
                            driveTimeInSecondsWithoutTraffic: 1039
                            latitude: -1.7437745123171688
                            longitude: -54.19187859370315
                    additionalProperties:
                        $ref: '#/components/schemas/GeoLocationWithDriveTime'
                origin:
                    $ref: '#/components/schemas/GeoLocation'
            example:
                destinations:
                    00eff3f3-ecfb-41ff-9ebc-78ed811e17f9:
                        distanceInMiles: 4
                        driveTimeInSecondsWithTraffic: 566
                        driveTimeInSecondsWithoutTraffic: 493
                        latitude: -74.12870564772521
                        longitude: -151.6240405624497
                    69cd9203-5e92-47a3-aa03-94b03752872a:
                        distanceInMiles: 9
                        driveTimeInSecondsWithTraffic: 1314
                        driveTimeInSecondsWithoutTraffic: 1039
                        latitude: -1.7437745123171688
                        longitude: -54.19187859370315
                origin:
                    latitude: 4.627174468915552
                    longitude: -88.72187894562788
